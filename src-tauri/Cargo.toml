[package]
name = "helix"
version = "0.1.14"
description = "Helix — AI coding assistant (Tauri rewrite of the Electron shell)"
authors = ["hyt"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "helix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
rand = "0.8"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "io-util", "macros", "process"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
once_cell = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Windows-only: powers the interactive terminal via the ConPTY API.
# Gated to cfg(windows) so the crate is never compiled on the Linux target.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_IO",
] }

# Linux-only: renderer HTTP proxy via the WebKitGTK default WebContext
# (WebsiteDataManager.set_network_proxy_settings). Gated so the crate never
# compiles this dependency on non-Linux targets.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
