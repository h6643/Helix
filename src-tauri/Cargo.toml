[package]
name = "helix"
version = "0.1.14"
description = "Helix — AI coding assistant (Tauri rewrite of the Electron shell)"
authors = ["hyt"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "helix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
rand = "0.8"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "io-util", "macros", "process"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
once_cell = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Windows-only: powers the interactive terminal via the ConPTY API.
# Gated to cfg(windows) so the crate is never compiled on the Linux target.
#
# Pinned to 0.51 on purpose. terminal.rs (the ConPTY backend) was written
# against the <=0.51 Win32 API:
#   - CreatePseudoConsole(size, hIn, hOut, 0, &mut hpc)  -> ()  (5-arg; 0.52+
#     changed it to return HPCON, i.e. 4-arg)
#   - HANDLE::NULL exists, and HANDLE is isize-based so it is Send+Sync
#     (0.52+ made HANDLE = *mut c_void, which is NOT Send -> the global
#     WINDOWS_TERMINAL static stops compiling)
#   - CreatePipe / CreateProcessW are gated behind `Win32_Security`, which must
#     be enabled here or they fail to resolve.
# DO NOT bump this version without also rewriting terminal.rs for the new API.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.51", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_Security",
] }

# Linux-only: renderer HTTP proxy via the WebKitGTK default WebContext
# (WebsiteDataManager.set_network_proxy_settings). Gated so the crate never
# compiles this dependency on non-Linux targets.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
