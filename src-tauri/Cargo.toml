[package]
name = "helix"
default-run = "helix"
version = "0.1.17"
description = "Helix — AI coding assistant (Tauri rewrite of the Electron shell)"
authors = ["ruowu"]
edition = "2021"
# tauri 2.11.5 自身声明 rustc ≥1.77.2，这里对齐（1.77 会让 MSRV 感知解析器
# 拒绝任何稳定的 plugin-updater 版本）。
rust-version = "1.77.2"

[lib]
name = "helix_lib"
#只留 rlib。`staticlib` / `cdylib` 是Tauri 移动端（iOS/Android）打包才需要的
# 产物类型，桌面端 `tauri dev` / `tauri build` 一个都不消费。但它们列在
# crate-type 里就意味着**每次编译 lib 都要额外跑一遍归档+链接**：本机
# staticlib产物`deps/helix_lib.lib`单个192MB，cdylib 还要再链一次 .dll。
# 这两步对「改一行 Rust 等 1 分钟」贡献了最大的一块。
# 万一将来要打移动端，再把这两项加回来。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# `~2.3` 是硬上限不是保守写法：2.4+ 要求 tauri ≥2.12，而 2.12 把 webview2-com
# 从 0.38 升到 0.39，与下面钉死的 0.38 组成双版本依赖图，
# browser_webview.rs 的 ICoreWebView2 系 COM 类型随即失配（E0308）。
# 升级这支前先读 Cargo.toml 里 webview2-com 段落的注释。
tauri-plugin-notification = "~2.3"
tauri-plugin-single-instance = "2"
# `~2.12` 同理是硬上限：2.13+ 要求 rustc ≥1.90；2.12（rustc 1.77.2、tauri ^2.10）
# 是与现锁定 tauri 2.11.5 匹配的最后一条兼容线。
tauri-plugin-updater = "~2.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
aes-gcm = "0.10"
# 浏览器导入（browser_import.rs）：读本机 Chrome/Edge 的 SQLite（Login Data /
# History）用 rusqlite bundled（不依赖系统 SQLite）；Chrome v10 密码是
# AES-128-CBC + HMAC-SHA256，CBC 链直接在 aes 的裸块 API 上手写（cbc crate 已
# 迁到 cipher 0.5，与本仓库钉死的 aes 0.8 / cipher 0.4 不兼容）。
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "io-util", "macros", "process"] }
once_cell = "1"
base64 = "0.22"
serde_yaml = "0.9"
mail-parser = "0.7"
which = "5"
urlencoding = "2.1.3"

# dev 默认（debug=true + incremental）会让 target/debug 涨到 29G：全量 CodeView
# 让每个依赖 crate 的 .o/.pdb 都带上调试信息。line-tables-only 保留栈回溯和断点，
# 去掉变量级调试；依赖库另外开优化（只 app 代码留调试语义）。
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
# 磁盘大头在这：几百个依赖 crate 原先每个都编一份带 CodeView 的 .o/.pdb。
# 关掉之后 panic 栈里依赖内部的帧没有 file:line，自己的代码仍精确到行。
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Windows-only: powers the interactive terminal via the ConPTY API.
# Gated to cfg(windows) so the crate is never compiled on the Linux target.
#
# Pinned to 0.61 to match the version Tauri 2 pulls in. Using the SAME major
# version as Tauri means there is exactly ONE `windows_core` in the dependency
# graph, which avoids the `Option<PCWSTR>: Param<...>` / `Send` clashes that
# arose when terminal.rs was built against a different `windows` major than
# Tauri's. terminal.rs was fully rewritten for the 0.61 Win32 API:
#   - CreatePseudoConsole(size, hIn, hOut, 0) -> Result<HPCON>  (4-arg)
#   - HANDLE / HPCON are *mut c_void -> not Send/Sync, so
#     WindowsTerminalSession is explicitly `unsafe impl Send/Sync`
#   - InitializeStartupInfoAttachedToPseudoConsole was removed in 0.58+; the
#     pseudo console is now attached via a proc-thread attribute list
#     (InitializeProcThreadAttributeList + UpdateProcThreadAttribute with
#     PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE)
#   - ReadFile/WriteFile moved to Win32::Storage::FileSystem, but each is
#     still gated behind the `Win32_System_IO` feature — that feature must stay
#     enabled or they fail to resolve at compile time.
#   - CreateProcessW: lpCommandLine: Option<PWSTR>, bInheritHandles: bool,
#     lpStartupInfo: *const STARTUPINFOW
# DO NOT bump this version without also adjusting terminal.rs for the new API.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Com",
    # CreateStreamOnHGlobal（截图的内存流承接处）在 Com 的子模块 StructuredStorage 里，
    # 是一个单独的 feature，只开 Win32_System_Com 不会带进来。
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
# WebView2 的 COM 绑定，浏览器截图要用 `ICoreWebView2::CapturePreview`。
# 版本必须跟 tauri 2.11 声明的 "0.38" 一致：cargo 会统一成同一份，`PlatformWebview::
# controller()` 返回的 ICoreWebView2Controller 才 cast 得进我们手上的类型；装上两个
# 版本就是两套同名 COM 包装 struct，接口指针互不认。
webview2-com = "0.38"

# Linux-only: renderer HTTP proxy via the WebKitGTK default WebContext
# (WebsiteDataManager.set_network_proxy_settings). Gated so the crate never
# compiles this dependency on non-Linux targets.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
