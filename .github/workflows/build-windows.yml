name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VER\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json
          echo "Synced version -> $VER"

      - name: Build Tauri app
        run: npx tauri build
        env:
          # 更新包签名（tauri-plugin-updater）。私钥内容是 ~/.tauri 下
          # helix-updater.key 的全文；密码为空（生成时未加密），secret 缺席时
          # 求值成空串即可。缺私钥时 createUpdaterArtifacts 会让构建直接失败，
          # 所以 tag 发布前必须先配好这两条 secret。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd src-tauri/target/release/bundle
          ZIP=$(ls nsis/*.nsis.zip | head -1)
          SIG="${ZIP}.sig"
          node -e "
            const fs = require('fs');
            const path = require('path');
            const [zip, sig, ver] = process.argv.slice(1);
            const asset = path.basename(zip);
            fs.writeFileSync('latest.json', JSON.stringify({
              version: ver,
              notes: 'Helix v' + ver,
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: fs.readFileSync(sig, 'utf8').trim(),
                  url: 'https://github.com/h6643/Helix/releases/download/v' + ver + '/' + asset,
                },
              },
            }, null, 2) + '\n');
          " "$ZIP" "$SIG" "$VER"
          echo "--- latest.json ---"
          cat latest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helix-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            src-tauri/target/release/bundle/latest.json
          retention-days: 30

  create-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: helix-windows
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
